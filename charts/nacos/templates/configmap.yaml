apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
## application.properties 挂载为 /home/nacos/conf/application.properties，
## 由启动脚本的 --spring.config.additional-location=file:${nacos.home}/conf/ 加载，
## 因此会覆盖镜像内置的同名配置文件。
## ref: https://nacos.io/docs/latest/manual/admin/system-configurations/
data:
  application.properties: |
    #*************** Nacos Server ***************#
    nacos.server.main.port={{ .Values.containerPorts.http }}
    nacos.server.contextPath=${SERVER_SERVLET_CONTEXTPATH:/nacos}
    server.error.include-message=ALWAYS

    #*************** Nacos Console ***************#
    nacos.console.port={{ .Values.containerPorts.console }}
    nacos.console.contextPath=${NACOS_CONSOLE_CONTEXTPATH:}
    nacos.console.remote.server.context-path=${SERVER_SERVLET_CONTEXTPATH:/nacos}
    nacos.console.ui.enabled=true
    nacos.console.ui.default=${NACOS_CONSOLE_UI_DEFAULT:next}
    spring.servlet.multipart.max-file-size=10MB
    spring.servlet.multipart.max-request-size=10MB
    server.servlet.encoding.enabled=true
    server.servlet.encoding.force=true
    server.servlet.encoding.charset=UTF-8

    #*************** Datasource ***************#
    nacos.plugin.datasource-dialect.type={{ ternary "mysql" "" (eq .Values.storage.type "mysql") }}
    nacos.plugin.datasource.db.num={{ .Values.storage.db.num | default 1 }}
    nacos.plugin.datasource.db.url.0={{ printf "jdbc:mysql://%s:%v/%s?%s" .Values.storage.db.host (.Values.storage.db.port | default 3306) (.Values.storage.db.database | default "nacos") (.Values.storage.db.param | default "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false") }}
    nacos.plugin.datasource.db.user.0={{ .Values.storage.db.username }}
    nacos.plugin.datasource.db.password.0=${MYSQL_SERVICE_PASSWORD:}
    nacos.plugin.datasource.db.pool.config.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
    nacos.plugin.datasource.db.pool.config.validation-timeout=10000
    nacos.plugin.datasource.db.pool.config.maximum-pool-size=20
    nacos.plugin.datasource.db.pool.config.minimum-idle=2

    #*************** Access Log ***************#
    server.tomcat.accesslog.enabled={{ .Values.tomcat.accessLog.enabled }}
    server.tomcat.accesslog.max-days=30
    server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %{User-Agent}i %{Request-Source}i
    server.tomcat.basedir=file:.

    #*************** Auth ***************#
    nacos.security.ignore.urls=${NACOS_SECURITY_IGNORE_URLS:/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-fe/public/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**}
    nacos.plugin.auth.type={{ .Values.auth.type | default "nacos" }}
    nacos.core.auth.enabled={{ .Values.auth.enabled | default true }}
    nacos.core.auth.admin.enabled=true
    nacos.core.auth.console.enabled=true
    nacos.plugin.auth.nacos.caching.enabled={{ .Values.auth.token.cacheEnabled | default false }}
    nacos.core.auth.server.identity.key=${NACOS_AUTH_IDENTITY_KEY:}
    nacos.core.auth.server.identity.value=${NACOS_AUTH_IDENTITY_VALUE:}
    nacos.plugin.auth.nacos.token.cache.enable=false
    nacos.plugin.auth.nacos.token.expire.seconds={{ .Values.auth.token.expireSeconds | default 1800 }}
    nacos.plugin.auth.nacos.token.secret.key=${NACOS_AUTH_TOKEN:}
    nacos.core.auth.nacos.anonymous.ai.enabled=${NACOS_AUTH_ALLOW_ANONYMOUS_AI_ENABLED:false}

    #*************** Metrics ***************#
    management.endpoints.web.exposure.include=prometheus
    management.metrics.export.elastic.enabled=false
    management.metrics.export.influx.enabled=false

    #*************** Config & Naming ***************#
    nacos.config.push.maxRetryTime=50
    nacos.naming.data.warmup=true
    nacos.naming.empty-service.auto-clean=true
    nacos.naming.empty-service.clean.initial-delay-ms=50000
    nacos.naming.empty-service.clean.period-time-ms=30000

    #*************** AI & Kubernetes ***************#
    nacos.ai.mcp.registry.enabled=${NACOS_AI_REGISTRY_ENABLED:false}
    nacos.ai.registry.port=${NACOS_AI_REGISTRY_PORT:9080}
    nacos.plugin.ai-pipeline.enabled=true
    nacos.plugin.ai-pipeline.type=skill-scanner
    nacos.plugin.ai-pipeline.skill-scanner.enabled=${NACOS_AI_PIPELINE_SKILL_SCANNER_ENABLED:true}
    nacos.istio.mcp.server.enabled=false
    nacos.k8s.sync.enabled=false
