apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
## NACOS_AUTH_* 为 Nacos 启动脚本的强制校验项（为空则 exit 255），
## 容器通过 secretKeyRef 注入，application.properties 以 ${...} 占位符引用；
## MYSQL_SERVICE_PASSWORD 同样由 application.properties 的 db.password.0 引用。
type: Opaque
stringData:
  NACOS_AUTH_TOKEN: {{ required "auth.token.value: Nacos 启动脚本要求该值非空，且官方建议使用足够强的 Base64 secret" .Values.auth.token.value | quote }}
  NACOS_AUTH_IDENTITY_KEY: {{ required "auth.server.identityKey: Nacos 启动脚本要求该值非空" .Values.auth.server.identityKey | quote }}
  NACOS_AUTH_IDENTITY_VALUE: {{ required "auth.server.identityValue: Nacos 启动脚本要求该值非空" .Values.auth.server.identityValue | quote }}
  MYSQL_SERVICE_PASSWORD: {{ .Values.storage.db.password | quote }}
